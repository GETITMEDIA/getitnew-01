<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img"
  aria-label="Social Media Marketing across Instagram, YouTube, Facebook and LinkedIn advertising">
  <title>Social Media Marketing - platform advertising</title>

  <defs>
    <radialGradient id="smmBg" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#1d1410" />
      <stop offset="0.55" stop-color="#121316" />
      <stop offset="1" stop-color="#0b0c0e" />
    </radialGradient>
    <linearGradient id="smmRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d" />
      <stop offset="0.5" stop-color="#ea5a06" />
      <stop offset="1" stop-color="#a33c03" />
    </linearGradient>
    <linearGradient id="smmIg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc658" />
      <stop offset="0.45" stop-color="#ee2a7b" />
      <stop offset="1" stop-color="#6228d7" />
    </linearGradient>
    <linearGradient id="smmYt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b30" />
      <stop offset="1" stop-color="#c50000" />
    </linearGradient>
    <linearGradient id="smmFb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8cff" />
      <stop offset="1" stop-color="#0b57d0" />
    </linearGradient>
    <linearGradient id="smmLi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e84e0" />
      <stop offset="1" stop-color="#074a8f" />
    </linearGradient>

    <filter id="smmTile" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="smmGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#smmBg)" />

  <!-- hub -->
  <circle cx="512" cy="512" r="196" fill="none" stroke="#ea5a06" stroke-width="18" opacity="0.5"
    filter="url(#smmGlow)" />
  <circle cx="512" cy="512" r="238" fill="none" stroke="#ea5a06" stroke-width="2" opacity="0.28" />
  <circle cx="512" cy="512" r="196" fill="#101215" stroke="url(#smmRing)" stroke-width="16" />

  <text x="512" y="478" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700"
    text-anchor="middle" letter-spacing="-1">Social</text>
  <text x="512" y="536" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700"
    text-anchor="middle" letter-spacing="-1">Media</text>
  <text x="512" y="594" fill="#ff8a3d" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700"
    text-anchor="middle" letter-spacing="-1">Marketing</text>

  <!-- spokes -->
  <g stroke="#ea5a06" stroke-width="3" opacity="0.45">
    <line x1="343" y1="343" x2="300" y2="300" />
    <line x1="681" y1="343" x2="724" y2="300" />
    <line x1="343" y1="681" x2="300" y2="724" />
    <line x1="681" y1="681" x2="724" y2="724" />
  </g>
  <g fill="#ff8a3d">
    <circle cx="344" cy="344" r="7" />
    <circle cx="680" cy="344" r="7" />
    <circle cx="344" cy="680" r="7" />
    <circle cx="680" cy="680" r="7" />
  </g>

  <!-- Instagram -->
  <g filter="url(#smmTile)">
    <rect x="183" y="183" width="156" height="156" rx="44" fill="url(#smmIg)" />
  </g>
  <g transform="translate(261 261)" fill="none" stroke="#ffffff" stroke-width="8">
    <rect x="-39" y="-39" width="78" height="78" rx="24" />
    <circle cx="0" cy="0" r="20" />
  </g>
  <circle cx="286" cy="236" r="7" fill="#ffffff" />
  <text x="261" y="118" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700"
    text-anchor="middle">Instagram</text>
  <text x="261" y="152" fill="#9aa0a6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"
    text-anchor="middle" letter-spacing="3">ADVERTISING</text>

  <!-- YouTube -->
  <g filter="url(#smmTile)">
    <rect x="685" y="183" width="156" height="156" rx="44" fill="url(#smmYt)" />
  </g>
  <rect x="716" y="228" width="94" height="66" rx="19" fill="#ffffff" />
  <path d="M752 247 L781 261 L752 275 Z" fill="#e00000" />
  <text x="763" y="118" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700"
    text-anchor="middle">YouTube</text>
  <text x="763" y="152" fill="#9aa0a6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"
    text-anchor="middle" letter-spacing="3">ADVERTISING</text>

  <!-- Facebook -->
  <g filter="url(#smmTile)">
    <rect x="183" y="685" width="156" height="156" rx="44" fill="url(#smmFb)" />
  </g>
  <g transform="translate(261 763) scale(0.1836) translate(-160 -256)" fill="#ffffff">
    <path
      d="M80 299.3V512h116V299.3h86.5l18-97.8H196v-33.3c0-51.6 20.2-71.8 72.5-71.8 16.3 0 29.4.4 37 1.2V9.8C291.4 3.3 256.4 0 236.2 0 129.3 0 80 50.5 80 159.4v42.1H6v97.8h74z" />
  </g>
  <text x="261" y="900" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700"
    text-anchor="middle">Facebook</text>
  <text x="261" y="934" fill="#9aa0a6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"
    text-anchor="middle" letter-spacing="3">ADVERTISING</text>

  <!-- LinkedIn -->
  <g filter="url(#smmTile)">
    <rect x="685" y="685" width="156" height="156" rx="44" fill="url(#smmLi)" />
  </g>
  <g transform="translate(763 763) scale(0.1699) translate(-224 -256)" fill="#ffffff">
    <path
      d="M100.28 448H7.4V148.9h92.88zM53.79 108.1C24.09 108.1 0 83.5 0 53.8a53.79 53.79 0 0 1 107.58 0c0 29.7-24.1 54.3-53.79 54.3zM447.9 448h-92.68V302.4c0-34.7-.7-79.2-48.29-79.2-48.29 0-55.69 37.7-55.69 76.7V448h-92.78V148.9h89.08v40.8h1.3c12.4-23.5 42.69-48.3 87.88-48.3 94 0 111.28 61.9 111.28 142.3V448z" />
  </g>
  <text x="763" y="900" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700"
    text-anchor="middle">LinkedIn</text>
  <text x="763" y="934" fill="#9aa0a6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"
    text-anchor="middle" letter-spacing="3">ADVERTISING</text>
</svg>
